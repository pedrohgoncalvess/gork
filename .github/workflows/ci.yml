name: CI e publicação

'on':
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  target:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release_tag: ${{ steps.target.outputs.release_tag }}
      ref: ${{ steps.target.outputs.ref }}
    steps:
      - id: target
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          release_tag=''
          ref="$GITHUB_SHA"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            release_tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            if [[ "$COMMIT_MESSAGE" =~ ^CI:\ publish\ (v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              release_tag="${BASH_REMATCH[1]}"
              ref="refs/tags/$release_tag"
            fi
          fi
          printf 'release_tag=%s\nref=%s\n' "$release_tag" "$ref" >> "$GITHUB_OUTPUT"

  python:
    needs: target
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.target.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install dependencies and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-color-emoji
          python -m pip install uv==0.11.16
          uv sync --locked
      - name: Validate release tag
        if: needs.target.outputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ needs.target.outputs.release_tag }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib

          with open('pyproject.toml', 'rb') as metadata:
              version = tomllib.load(metadata)['project']['version']
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', tag) or tag != f'v{version}':
              raise SystemExit(f'Tag {tag!r} does not match project version {version!r}')
          PY
      - name: Run Python tests
        env:
          DATA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          PYTHON_DOTENV_DISABLED: '1'
        run: uv run --locked python -m unittest discover -s tests

  javascript:
    needs: target
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.target.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test tests/test_admin_models.js

  sound-sticker:
    needs: target
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.target.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: docker/sound-sticker/go.mod
          cache-dependency-path: docker/sound-sticker/go.sum
      - run: go test ./...
        working-directory: docker/sound-sticker

  publish:
    if: github.event_name == 'push' && !github.event.deleted && needs.target.outputs.release_tag != ''
    needs: [target, python, javascript, sound-sticker]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.target.outputs.ref }}
          persist-credentials: false
      - name: Build and publish the API image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.target.outputs.release_tag }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_TAG"
          docker build --file docker/Dockerfile --tag "$image" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.version=${RELEASE_TAG#v}" .
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image"
